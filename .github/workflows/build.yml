name: Build ESP Thread Gateway and Node

on:
  push:
    branches: [ esp-thread-br ]
  workflow_dispatch: 

jobs:
  build-thread-binaries:
    name: Build Firmware Binaries
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Clone esp-thread-br repository
        run: |
          # Clone the Thread Border Router repository (v1.3 is compatible with IDF v5.5)
          git clone -b v1.3 --recursive https://github.com/espressif/esp-thread-br.git
          
      - name: Build RCP (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh
          cd $IDF_PATH/examples/openthread/ot_rcp
          idf.py set-target esp32h2
          idf.py build

      - name: Build Gateway (ESP32-S3)
        run: |
          . /opt/esp/idf/export.sh
          # FIX 1: Export the path so CMake can find the thread-br components
          export ESP_THREAD_BR_PATH=${GITHUB_WORKSPACE}/esp-thread-br
          
          # FIX 2: Build directly in your standalone project folder
          cd ${GITHUB_WORKSPACE}/border_router
          idf.py set-target esp32s3
          idf.py build
                  
          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/gw
                  
          # FIX 3: Point to the correct binary name based on project(border_router_app)
          cp build/border_router_app.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/gateway.bin
                  
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/

          # Use "|| true" to prevent the workflow from failing if these optional binaries aren't generated
          cp build/ota_data_initial.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/ || true
          cp build/web_storage.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/ || true
          cp build/rcp_fw.bin ${GITHUB_WORKSPACE}/build_artifacts/gw/ || true

      - name: Build Node (ESP32-H2)
        run: |
          . /opt/esp/idf/export.sh
          # Export the path for the node as well
          export ESP_THREAD_BR_PATH=${GITHUB_WORKSPACE}/esp-thread-br
          
          # Build directly in your standalone project folder
          cd ${GITHUB_WORKSPACE}/sensor_node
          idf.py set-target esp32h2
          idf.py build
          
          mkdir -p ${GITHUB_WORKSPACE}/build_artifacts/node
          
          # Point to the correct binary name based on project(sensor_node)
          cp build/sensor_node.bin ${GITHUB_WORKSPACE}/build_artifacts/node/node.bin
          
          cp build/bootloader/bootloader.bin ${GITHUB_WORKSPACE}/build_artifacts/node/
          cp build/partition_table/partition-table.bin ${GITHUB_WORKSPACE}/build_artifacts/node/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: thread-firmware-binaries
          path: build_artifacts/
          retention-days: 7